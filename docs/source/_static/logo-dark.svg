<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     role="img" aria-label="PyTheranostics">
  <defs>
    <linearGradient id="pt-bg-dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#pt-bg-dark)"/>
  <!-- Area under the time-activity curve: the time-integrated activity. -->
  <path d="M15 47 L15 19 C24 35 32 41 49 43 L49 47 Z" fill="#ffffff" opacity="0.28"/>
  <path d="M15 19 C24 35 32 41 49 43" fill="none" stroke="#ffffff" stroke-width="2.6"
        stroke-linecap="round"/>
  <path d="M13 47 H51" fill="none" stroke="#ffffff" stroke-width="2.2"
        stroke-linecap="round" opacity="0.85"/>
  <!-- The injected activity, decaying from it. -->
  <circle cx="15" cy="19" r="4" fill="#ffffff"/>
  <g stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.75">
    <path d="M23 13 A 11 11 0 0 0 21 9"/>
    <path d="M28 11 A 17 17 0 0 0 25 5"/>
  </g>
</svg>
