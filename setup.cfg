# Flake8 configuration
# Note: Flake8 does NOT support pyproject.toml natively (as of 2025)
# See: https://github.com/PyCQA/flake8/issues/234
[flake8]
max-line-length = 88
# Ignore formatting issues that Black handles differently:
# E203: whitespace before ':' (Black handles this)
# E501: line too long (Black handles this)
# E226: missing whitespace around arithmetic operator (Black is more selective)
# W503: line break before binary operator (Black prefers this style)
extend-ignore = E203,W503,E501,E226
exclude = 
    .git,
    __pycache__,
    .pytest_cache,
    .mypy_cache,
    venv,
    .venv,
    build,
    dist,
    *.egg-info
