name: CI

on:
  pull_request:

# A fixup push makes the run already in flight irrelevant. Cancel it rather
# than paying for six jobs to finish grading superseded code.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          # There is no requirements.txt, so the cache key has to be told
          # where the dependency declarations actually live.
          cache-dependency-path: pyproject.toml

      # The hooks build their own virtualenvs, and the pytest-smoke hook pulls
      # in numpy, SimpleITK and scikit-image to do it. Uncached, that is the
      # bulk of this job.
      - name: Cache the pre-commit hook environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install pre-commit
        run: python -m pip install pre-commit

      # Formatting and style do not vary by interpreter, so this runs once
      # here rather than once per entry in the test matrix.
      - name: Run the hooks
        run: pre-commit run --all-files

  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,test]"

      - name: Run pytest
        run: pytest -rs
